<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>米国株ランキング</title>

  <script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
      color: #273248;
      font-family: Arial, "Hiragino Kaku Gothic ProN",
        "Noto Sans JP", Meiryo, sans-serif;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 26px;
    }

    .panel {
      margin-bottom: 18px;
      padding: 18px;
      background: #fff;
      border: 1px solid #e2e7f0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(30, 50, 80, 0.04);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
    }

    select,
    input,
    button {
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid #d5dce8;
      border-radius: 7px;
      background: #fff;
      color: #273248;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #eef3fb;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      color: #68758b;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .chart-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .chart-title {
      font-size: 18px;
      font-weight: 700;
    }

    .chart-note {
      margin-bottom: 10px;
      color: #68758b;
      font-size: 12px;
      line-height: 1.7;
    }

    #chart {
      width: 100%;
      height: 520px;
      min-height: 320px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e8edf4;
      text-align: right;
      white-space: nowrap;
    }

    th {
      background: #f7f9fc;
      color: #536078;
      font-weight: 700;
    }

    th:first-child,
    td:first-child,
    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    tbody tr {
      cursor: pointer;
    }

    tbody tr:hover {
      background: #f1f6ff;
    }

    tbody tr.selected {
      background: #e8f1ff;
    }

    .positive {
      color: #d13e46;
    }

    .negative {
      color: #2475d2;
    }

    .muted {
      color: #8792a5;
    }

    .empty {
      padding: 24px;
      color: #68758b;
      text-align: center;
    }

    @media (max-width: 700px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 22px;
      }

      .panel {
        padding: 12px;
      }

      #chart {
        height: 400px;
      }

      th,
      td {
        padding: 8px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>米国株ランキング</h1>

    <section class="panel">
      <div class="controls">
        <label for="rankingPeriod">ランキング期間</label>

        <select id="rankingPeriod">
          <option value="1m">1か月</option>
          <option value="3m">3か月</option>
          <option value="6m">6か月</option>
          <option value="1y" selected>1年</option>
          <option value="3y">3年</option>
          <option value="5y">5年</option>
          <option value="all">全期間</option>
        </select>

        <label for="rankingType">ランキング基準</label>

        <select id="rankingType">
          <option value="latest">最新株価</option>
          <option value="change">最安値からの上昇率</option>
        </select>

        <label for="sortOrder">並び順</label>

        <select id="sortOrder">
          <option value="desc">降順</option>
          <option value="asc">昇順</option>
        </select>
      </div>

      <div id="status" class="status">
        株価データを読み込んでいます……
      </div>
    </section>

    <section class="panel">
      <div class="chart-header">
        <div id="chartTitle" class="chart-title">
          チャート
        </div>

        <div class="controls">
          <button id="prevStock" type="button">← 前の銘柄</button>
          <button id="nextStock" type="button">次の銘柄 →</button>
        </div>
      </div>

      <div class="controls" style="margin-bottom: 14px;">
        <label for="candleType">ローソク足</label>

        <select id="candleType">
          <option value="day">日足</option>
          <option value="week">週足</option>
          <option value="month">月足</option>
        </select>

        <label for="chartRange">チャート期間</label>

        <select id="chartRange">
          <option value="1y">1年</option>
          <option value="3y">3年</option>
          <option value="5y">5年</option>
          <option value="10y">10年</option>
          <option value="all" selected>全期間</option>
        </select>

        <label for="autoRotate">自動切り替え</label>

        <select id="autoRotate">
          <option value="0">停止</option>
          <option value="1">1秒</option>
          <option value="3">3秒</option>
          <option value="5">5秒</option>
          <option value="10">10秒</option>
          <option value="15">15秒</option>
          <option value="30">30秒</option>
          <option value="60">60秒</option>
        </select>

        <button id="refreshChart" type="button">チャート更新</button>
      </div>

      <div class="chart-note">
        縦軸は株価データに合わせて自動調整します。
        上昇率は、選択期間内の最安値から最新終値までの変化率です。
        配当金を含むトータルリターンとは異なります。
      </div>

      <div id="chart"></div>
    </section>

    <section class="panel">
      <h2 style="margin-top: 0;">ランキング一覧</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>順位</th>
              <th>銘柄</th>
              <th>最新株価</th>
              <th>期間内最安値</th>
              <th>最安値からの上昇率</th>
              <th>データ日付</th>
            </tr>
          </thead>

          <tbody id="rankingBody">
            <tr>
              <td colspan="6" class="empty">
                データを読み込んでいます……
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    let stocks = [];
    let ranking = [];
    let selectedCode = null;
    let chart = null;
    let candleSeries = null;
    let rotateTimer = null;
    let resizeObserver = null;

    function isoDate(date) {
      return date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");
    }

    function formatNumber(value, digits = 2) {
      if (
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
      ) {
        return "—";
      }

      return Number(value).toLocaleString("en-US", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }

    function getLatest(data) {
      return data && data.length ? data[data.length - 1] : null;
    }

    function getPeriodMonths(period) {
      const months = {
        "1m": 1,
        "3m": 3,
        "6m": 6,
        "1y": 12,
        "3y": 36,
        "5y": 60,
        "10y": 120
      };

      return months[period] || null;
    }

    function filterByPeriod(data, period) {
      if (!data || !data.length || period === "all") {
        return data || [];
      }

      const months = getPeriodMonths(period);

      if (!months) {
        return data;
      }

      const last = data[data.length - 1];
      const from = new Date(last.time + "T12:00:00");

      from.setMonth(from.getMonth() - months);

      const fromDate = isoDate(from);

      return data.filter(item => item.time >= fromDate);
    }

    function aggregate(data, type) {
      if (!data || !data.length) {
        return [];
      }

      if (type === "day") {
        return data.map(item => ({
          time: item.time,
          open: Number(item.open),
          high: Number(item.high),
          low: Number(item.low),
          close: Number(item.close)
        }));
      }

      const groups = new Map();

      for (const item of data) {
        const date = new Date(item.time + "T12:00:00");
        let key;

        if (type === "month") {
          key = date.getFullYear() + "-" +
            String(date.getMonth() + 1).padStart(2, "0") + "-01";
        } else {
          const day = date.getDay();
          const diff = (day + 6) % 7;

          date.setDate(date.getDate() - diff);
          key = isoDate(date);
        }

        if (!groups.has(key)) {
          groups.set(key, {
            time: key,
            open: Number(item.open),
            high: Number(item.high),
            low: Number(item.low),
            close: Number(item.close)
          });
        } else {
          const group = groups.get(key);

          group.high = Math.max(group.high, Number(item.high));
          group.low = Math.min(group.low, Number(item.low));
          group.close = Number(item.close);
        }
      }

      return Array.from(groups.values())
        .sort((a, b) => a.time.localeCompare(b.time));
    }

    /*
     * ランキング計算
     *
     * periodLow:
     * 選択期間内の各営業日の安値のうち、最も低い値。
     *
     * change:
     * (最新終値 / 期間内最安値 - 1) * 100
     *
     * 例：
     * 最新終値 130.55
     * 期間内最安値 114.50
     * 上昇率 +14.02%
     */
    function calculateRanking() {
      const period = $("rankingPeriod").value;
      const type = $("rankingType").value;
      const order = $("sortOrder").value;

      ranking = stocks.map(stock => {
        const allData = stock.data || [];
        const latest = getLatest(allData);
        const periodData = filterByPeriod(allData, period);

        const lows = periodData
          .map(item => Number(item.low))
          .filter(value => Number.isFinite(value) && value > 0);

        const periodLow = lows.length
          ? Math.min(...lows)
          : null;

        let change = null;

        const latestClose = latest
          ? Number(latest.close)
          : NaN;

        if (
          periodLow !== null &&
          periodLow > 0 &&
          Number.isFinite(latestClose) &&
          latestClose > 0
        ) {
          change = (latestClose / periodLow - 1) * 100;
        }

        return {
          ...stock,
          latest,
          periodLow,
          change
        };
      }).filter(stock => stock.latest);

      ranking.sort((a, b) => {
        let result;

        if (type === "change") {
          const aValue = a.change;
          const bValue = b.change;

          if (aValue === null && bValue === null) {
            result = 0;
          } else if (aValue === null) {
            result = 1;
          } else if (bValue === null) {
            result = -1;
          } else {
            result = aValue - bValue;
          }
        } else {
          result =
            Number(a.latest.close) - Number(b.latest.close);
        }

        return order === "asc" ? result : -result;
      });

      renderRanking();
    }

    function renderRanking() {
      const body = $("rankingBody");
      body.innerHTML = "";

      if (!ranking.length) {
        body.innerHTML =
          '<tr><td colspan="6" class="empty">' +
          '表示できるデータがありません。</td></tr>';
        return;
      }

      ranking.forEach((stock, index) => {
        const row = document.createElement("tr");

        if (stock.code === selectedCode) {
          row.classList.add("selected");
        }

        const change = stock.change;

        const changeClass =
          change > 0 ? "positive" :
          change < 0 ? "negative" : "";

        const changeText = change === null
          ? "—"
          : (change > 0 ? "+" : "") +
            formatNumber(change) + "%";

        row.innerHTML = `
          <td>${index + 1}</td>
          <td>
            <strong>${escapeHtml(stock.code || "")}</strong>
            <br>
            <span class="muted">${escapeHtml(stock.name || "")}</span>
          </td>
          <td>${formatNumber(stock.latest.close)}</td>
          <td>${formatNumber(stock.periodLow)}</td>
          <td class="${changeClass}">${changeText}</td>
          <td>${escapeHtml(stock.latest.time || "—")}</td>
        `;

        row.addEventListener("click", () => {
          selectedCode = stock.code;
          renderRanking();
          renderChart();
        });

        body.appendChild(row);
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function initChart() {
      if (chart || !window.LightweightCharts) {
        return;
      }

      chart = LightweightCharts.createChart($("chart"), {
        layout: {
          background: { color: "#ffffff" },
          textColor: "#273248"
        },

        grid: {
          vertLines: { color: "#edf0f5" },
          horzLines: { color: "#edf0f5" }
        },

        rightPriceScale: {
          borderColor: "#dce2ec",
          autoScale: true,
          mode: LightweightCharts.PriceScaleMode.Normal,
          scaleMargins: {
            top: 0.08,
            bottom: 0.08
          }
        },

        timeScale: {
          borderColor: "#dce2ec",
          timeVisible: false,
          secondsVisible: false
        },

        localization: {
          locale: "ja-JP"
        },

        width: $("chart").clientWidth,
        height: $("chart").clientHeight
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: "#d94b4b",
        downColor: "#2475d2",
        borderUpColor: "#d94b4b",
        borderDownColor: "#2475d2",
        wickUpColor: "#d94b4b",
        wickDownColor: "#2475d2"
      });

      if (window.ResizeObserver) {
        resizeObserver = new ResizeObserver(() => {
          if (chart) {
            chart.applyOptions({
              width: $("chart").clientWidth,
              height: $("chart").clientHeight
            });
          }
        });

        resizeObserver.observe($("chart"));
      } else {
        window.addEventListener("resize", () => {
          if (chart) {
            chart.applyOptions({
              width: $("chart").clientWidth,
              height: $("chart").clientHeight
            });
          }
        });
      }
    }

    function renderChart() {
      initChart();

      if (!chart || !candleSeries) {
        $("chartTitle").textContent =
          "チャート：チャートライブラリを読み込めませんでした";
        return;
      }

      const stock = stocks.find(item => item.code === selectedCode);

      if (!stock || !stock.data || !stock.data.length) {
        $("chartTitle").textContent =
          "チャート：表示できるデータがありません";

        candleSeries.setData([]);
        return;
      }

      $("chartTitle").textContent =
        `チャート：${stock.code} ${stock.name || ""}`;

      let data = aggregate(stock.data, $("candleType").value);
      data = filterByPeriod(data, $("chartRange").value);

      data = data.filter(item =>
        Number.isFinite(item.open) &&
        Number.isFinite(item.high) &&
        Number.isFinite(item.low) &&
        Number.isFinite(item.close) &&
        item.open > 0 &&
        item.high > 0 &&
        item.low > 0 &&
        item.close > 0
      );

      if (!data.length) {
        candleSeries.setData([]);

        $("chartTitle").textContent =
          `チャート：${stock.code} 表示できるデータがありません`;

        return;
      }

      candleSeries.setData(data);

      chart.timeScale().fitContent();

      candleSeries.priceScale().applyOptions({
        autoScale: true,
        scaleMargins: {
          top: 0.08,
          bottom: 0.08
        }
      });
    }

    function selectRelativeStock(direction) {
      if (!ranking.length) {
        return;
      }

      let index = ranking.findIndex(
        stock => stock.code === selectedCode
      );

      if (index < 0) {
        index = 0;
      } else {
        index =
          (index + direction + ranking.length) % ranking.length;
      }

      selectedCode = ranking[index].code;

      renderRanking();
      renderChart();
    }

    function updateAutoRotate() {
      if (rotateTimer) {
        clearInterval(rotateTimer);
        rotateTimer = null;
      }

      const seconds = Number($("autoRotate").value);

      if (seconds > 0) {
        rotateTimer = setInterval(() => {
          selectRelativeStock(1);
        }, seconds * 1000);
      }
    }

    async function loadData() {
      $("status").textContent =
        "株価データを読み込んでいます……";

      try {
        const response = await fetch(
          "stock_data.json?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            "stock_data.json の読み込みに失敗しました。HTTP " +
            response.status
          );
        }

        const json = await response.json();

        let source;

        if (Array.isArray(json)) {
          source = json;
        } else if (json && Array.isArray(json.stocks)) {
          source = json.stocks;
        } else if (json && typeof json === "object") {
          source = Object.entries(json)
            .filter(([key, value]) =>
              Array.isArray(value) ||
              (value && Array.isArray(value.data))
            )
            .map(([key, value]) => {
              if (Array.isArray(value)) {
                return {
                  code: key,
                  name: key,
                  data: value
                };
              }

              return {
                code: value.code || key,
                name: value.name || key,
                data: value.data
              };
            });
        } else {
          source = [];
        }

        stocks = source.map(stock => {
          const rawData = Array.isArray(stock.data)
            ? stock.data
            : [];

          const normalized = rawData.map(item => ({
            time: String(item.time || item.date || "").slice(0, 10),
            open: Number(item.open),
            high: Number(item.high),
            low: Number(item.low),
            close: Number(item.close)
          })).filter(item =>
            /^\d{4}-\d{2}-\d{2}$/.test(item.time) &&
            Number.isFinite(item.open) &&
            Number.isFinite(item.high) &&
            Number.isFinite(item.low) &&
            Number.isFinite(item.close) &&
            item.open > 0 &&
            item.high > 0 &&
            item.low > 0 &&
            item.close > 0
          ).sort((a, b) => a.time.localeCompare(b.time));

          return {
            code: String(stock.code || stock.symbol || ""),
            name: String(
              stock.name || stock.code || stock.symbol || ""
            ),
            data: normalized
          };
        }).filter(stock => stock.code && stock.data.length);

        if (!stocks.length) {
          throw new Error(
            "株価データがありません。stock_data.json の形式を確認してください。"
          );
        }

        if (
          !selectedCode ||
          !stocks.some(stock => stock.code === selectedCode)
        ) {
          selectedCode = stocks[0].code;
        }

        $("status").textContent =
          `${stocks.length} 銘柄を読み込みました。`;

        calculateRanking();
        renderChart();

      } catch (error) {
        console.error(error);

        $("status").textContent =
          "データの読み込みに失敗しました：" + error.message;

        $("rankingBody").innerHTML = `
          <tr>
            <td colspan="6" class="empty">
              stock_data.json を確認してください。
              <br>
              ${e
